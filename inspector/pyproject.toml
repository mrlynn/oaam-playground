[project]
name = "memory-inspector"
version = "0.1.0"
description = "See what an Oracle AI Agent Memory agent remembers, retrieves and revises, turn by turn"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Stage mapping keys off this package's log messages, so the range is narrow.
    "oracleagentmemory>=26.6.0,<26.7",
    "oracledb>=3.4.2",
]

[project.scripts]
memory-inspector = "memory_inspector.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_inspector"]
