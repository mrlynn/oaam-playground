[project]
name = "companion"
version = "0.1.0"
description = "A small terminal work companion with durable memory, instrumented by memory-inspector"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "oracleagentmemory==26.6.0",
    "memory-inspector",
    "oracledb>=3.4.2",
    "litellm>=1.101",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
companion = "companion.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
memory-inspector = { path = "../inspector", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]
