[project]
name = "memory-labs"
version = "0.1.0"
description = "Labs 1-3: agent memory you can inspect, diagnose and fix, on Oracle AI Agent Memory"
requires-python = ">=3.10,<3.14"
dependencies = [
    "oracleagentmemory==26.6.0",
    "memory-inspector[judge]",
    "oracledb>=3.4.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jupyterlab>=4",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
memory-inspector = { path = "../inspector", editable = true }
