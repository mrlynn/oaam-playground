# Oracle AI Database Free 26ai (23.26.x) for the memory inspector.
# Pinned tag: oracleagentmemory 26.6.0 needs 26ai or later.
services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-faststart
    container_name: aim-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in infra/.env}
      AIM_APP_PASSWORD: ${AIM_APP_PASSWORD:?set AIM_APP_PASSWORD in infra/.env}
      AIM_WEB_PASSWORD: ${AIM_WEB_PASSWORD:?set AIM_WEB_PASSWORD in infra/.env}
      AIM_LIVE_PASSWORD: ${AIM_LIVE_PASSWORD:?set AIM_LIVE_PASSWORD in infra/.env}
    volumes:
      - aim-oracle-data:/opt/oracle/oradata
      - ./init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  aim-oracle-data:
